<!DOCTYPE html>
<html lang="en">
<head>
  <!-- The head holds settings. Nothing here shows on the page except the title in the browser tab. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shreya</title>

  <!-- CSS: this controls how everything looks. -->
  <style>
    body {
      font-family: Georgia, serif;
      background-color: #f7f5f0;
      color: #1c2430;
      max-width: 700px;      /* keeps lines from getting too wide */
      margin: 0 auto;        /* centers the page */
      padding: 40px 20px;
      line-height: 1.6;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 0;
    }

    .tagline {
      color: #c2410c;        /* orange accent */
      margin-top: 4px;
    }

    h2 {
      border-bottom: 2px solid #c2410c;
      padding-bottom: 4px;
      margin-top: 40px;
    }

    a {
      color: #c2410c;
    }
  </style>
</head>

<body>
  <!-- The body holds everything you see on the page. -->

  <h1>Shreya</h1>
  <p class="tagline">High school student</p>

  <h2>About Me</h2>
  <p>
    I'm a high school student. I'm interested in tennis and coding.
  </p>

</body>
</html>
